<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="../assets/bootstrap-5.3.7/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/icons/bootstrap-icons.css">
</head>

<style>
    body {
        font-family: 'Poppins', sans-serif;
        background-color: #f5f5f5;
    }

    form {
        border: 2px solid #ccc;
        border-radius: 15px;
        background-color: rgba(215, 211, 211, 0.28);
        padding: 30px;
    }

    .input-error {
        border: 1px solid red !important;
    }

    .input-normal {
        border: 1px solid #ced4da;
    }

    .toggle-password {
        cursor: pointer;
    }
</style>

<body class="bg-main">
    <main>
        <section>
            <div class="container">
                <div class="row align-items-center" style="height: 100vh;">
                    <!-- Left Image -->
                    <div class="col-lg-6 d-none d-lg-flex">
                        <img src="../assets/images/register.png" alt="Authentication" class="img-fluid w-100">
                    </div>

                    <!-- Register Form -->
                    <div class="col-12 col-lg-6">
                        <form id="registerForm">
                            <h1 class="mb-3">Register</h1>
                            <p class="mb-4">Create your account. It’s free and only takes a minute.</p>

                            <div class="row g-3">
                                <div class="col-6">
                                    <input type="text" id="fname" class="form-control" placeholder="First Name">
                                    <span id="errfname" class="error"></span>
                                </div>
                                <div class="col-6">
                                    <input type="text" id="lname" class="form-control" placeholder="Last Name">
                                    <span id="errlname" class="error"></span>
                                </div>
                            </div>

                            <div class="mt-3">
                                <input type="email" id="email" class="form-control" placeholder="Email">
                                <span id="erremail" class="error"></span>
                            </div>

                            <div class="mt-3 position-relative">
                                <input type="password" id="password" class="form-control" placeholder="Password">
                                <span class="position-absolute top-50 end-0 translate-middle-y me-3 toggle-password">
                                    <i class="bi bi-eye-slash" id="eyePassword"></i>
                                </span>
                                <span id="errpassword" class="error"></span>
                            </div>

                            <div class="mt-3 position-relative">
                                <input type="password" id="cpassword" class="form-control"
                                    placeholder="Confirm Password">
                                <span class="position-absolute top-50 end-0 translate-middle-y me-3 toggle-password">
                                    <i class="bi bi-eye-slash" id="eyeCPassword"></i>
                                </span>
                                <span id="errcpassword" class="error"></span>
                            </div>

                            <div class="form-check mt-3">
                                <input class="form-check-input border-0 bg-main" type="checkbox" checked
                                    id="termsCheck">
                                <label class="form-check-label" for="termsCheck">
                                    I accept the <span class="text-white text-decoration-underline">Terms & Privacy
                                        Policy</span>
                                </label>
                            </div>

                            <button type="button" class="btn btn-main w-100 mt-4" onclick="signup()">Register</button>

                            <div class="text-center mt-3">
                                Already have an account? <a href="login.html" class="text-white">Login</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>

        <!-- Toast Container -->
        <div class="toast-container top-0 start-50 translate-middle-x p-3">
            <div id="toastMsg" class="toast align-items-center" role="alert">
                <div class="toast-body text-center">
                    Toast message here
                </div>
            </div>
        </div>
    </main>

    <script src="../assets/js/logout.js"></script>
    <script src="../assets/bootstrap-5.3.7/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/register.js"></script>
</body>

</html>
