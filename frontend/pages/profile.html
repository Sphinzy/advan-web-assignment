<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="../assets/bootstrap-5.3.7/css/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/icons/bootstrap-icons.css">
    <style>
        /* Make nav pills scrollable horizontally */
        #pills-tab {
            overflow-x: auto;
            white-space: nowrap;
        }

        #pills-tab .nav-link {
            flex: 0 0 auto;
        }

        /* Card img height */
        .card-img {
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <main>
        <div class="container py-4">
            <div class="row">
                <!-- PROFILE COLUMN -->
                <div class="col-lg-4 mb-4">
                    <div class="bg-card-theme shadow p-3 animate__animated animate__fadeInUp" data-aos="fade-up">
                        <div class="card border-0 text-center bg-transparent">
                            <div class="card-header bg-transparent border-0">
                                <div class="card-img pfp m-auto">
                                    <img id="profile-avatar" src="../../image/project-logo/profile-img.jpg"
                                        style="width: 100px; height: 100px; border-radius: 50%;" alt>
                                </div>
                            </div>
                            <div class="card-body pfp-name">
                                <h4 class="card-title fw-semibold mb-0" id="profile-name">Name</h4>
                                <h6 class="card-title text-secondary"><span>@</span><span
                                        id="profile-username">username</span></h6>
                                <p class="card-text my-3" id="profile-bio">Bio</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- TABS COLUMN -->
                <div class="col-lg-8">
                    <div class="shadow p-3 my-4 animate__animated animate__fadeInUp" data-aos="fade-up">
                        <!-- Nav pills -->
                        <ul class="nav nav-pills mb-3 gap-2 flex-nowrap" id="pills-tab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="pills-jobs-tab" data-bs-toggle="pill"
                                    data-bs-target="#pills-jobs" type="button" role="tab" aria-controls="pills-jobs"
                                    aria-selected="true">Job Posts</button>
                            </li>
                            <li class="nav-item active" role="presentation">
                                <button class="nav-link" id="pills-blogs-tab" data-bs-toggle="pill"
                                    data-bs-target="#pills-blogs" type="button" role="tab" aria-controls="pills-blogs"
                                    aria-selected="false">Blog Posts</button>
                            </li>
                        </ul>

                        <!-- Tab content -->
                        <div class="tab-content" id="pills-tabContent">
                            <!-- JOB POSTS -->
                            <div class="tab-pane fade " id="pills-jobs" role="tabpanel"
                                aria-labelledby="pills-jobs-tab">
                                <div class="row g-3" id="jobs-container">
                                    <!-- Jobs will be injected here -->
                                </div>
                            </div>

                            <!-- BLOG POSTS -->
                            <div class="tab-pane fade show active" id="pills-blogs" role="tabpanel"
                                aria-labelledby="pills-blogs-tab">
                                <div class="row g-3" id="blogs-container">
                                    <!-- Blogs will be injected here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
<!-- Update Modal -->
<div class="modal fade" id="updateModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Update Post</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="update-id">
                <div class="mb-2">
                    <label>Title</label>
                    <input type="text" id="update-title" class="form-control">
                </div>
                <div class="mb-2">
                    <label>Image URL</label>
                    <input type="text" id="update-image" class="form-control">
                </div>
                <div class="mb-2">
                    <label>Content</label>
                    <textarea id="update-content" class="form-control"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button id="btnSavePost" class="btn btn-primary">Save</button>
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>
    <script src="../assets/js/profile.js"></script>

    <script src="../assets/bootstrap-5.3.7/js/bootstrap.bundle.min.js"></script>
</body>

</html>
