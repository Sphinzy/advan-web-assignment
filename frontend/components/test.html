<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .temple-profile {
  background: linear-gradient(to bottom, #FFFDD0, #FFE4B5);
  font-family: 'Sanskrit Text', 'Noto Serif Devanagari', serif;
}

.lotus-profile-frame {
  position: relative;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, #FFD700, #FF9933);
  padding: 10px;
}

.lotus-profile-frame::before {
  content: '🪷';
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 30px;
}

.profile-pic {
  width: 180px;
  height: 180px;
  border-radius: 50%;
  border: 3px solid #8B0000;
}

.dharma-stats {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin: 30px 0;
}

.stat-card {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border: 2px solid #8B0000;
  box-shadow: 0 4px 8px rgba(139, 0, 0, 0.3);
}
</style>
<body>
    <div class="temple-profile">
        <!-- Temple Arch Header -->
        <div class="temple-arch">
            <div class="om-symbol">🕉️</div>
            <h1 class="spiritual-name">Shanti Devi</h1>
            <div class="temple-bell">🔔</div>
        </div>
    
        <!-- Profile Area with Lotus Border -->
        <div class="lotus-profile-frame">
            <div class="lotus-petal top"></div>
            <img src="profile.jpg" alt="Profile" class="profile-pic">
            <div class="lotus-petal bottom"></div>
        </div>
    
        <!-- Spiritual Stats -->
        <div class="dharma-stats">
            <div class="stat-card" style="background: #FFD700;">
                <div class="stat-icon">🕉️</div>
                <div class="stat-number">108</div>
                <div class="stat-label">Days Sadhana</div>
            </div>
            <!-- More stats... -->
        </div>
    </div>
</body>
</html>
